<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MenúStock — pruebas</title>
    <link rel="stylesheet" href="../home.css">
</head>
<body>
<pre id="out">ejecutando...</pre>

<script type="module">
/**
 * Prueba end-to-end de MenúStock.
 *
 * Monta la app real (index.html + home.js) en esta página y maneja la
 * interfaz como lo haría una persona: hacer clic, escribir en los
 * campos, elegir opciones, responder los diálogos de la app.
 * Al final deja el resultado en #out para que el runner (tests/run.js)
 * lo lea del DOM.
 *
 * Se ejecuta abriendo tests/e2e.html en un navegador headless.
 */

const out = document.getElementById("out");   // se conserva aunque se reemplace body
const log = [];

function ok(name, condition, extra = "") {
    log.push(`${condition ? "OK   " : "FALLA"} ${name}${extra ? "  -> " + extra : ""}`);
}

function fail(name, error) {
    log.push(`FALLA ${name}  -> ${error && error.message}`);
    log.push(String(error && error.stack).split("\n").slice(0, 4).join("\n"));
}

// --- Red de seguridad: si algún código usara alert/prompt nativos,
//     el navegador headless se bloquearía. ---
window.alert = () => {};
window.prompt = () => null;
window.confirm = () => true;

function waitFor(predicate, maxTicks = 400) {
    return new Promise((resolve, reject) => {
        // Se cuentan ticks y no milisegundos: el navegador headless corre
        // con reloj virtual y Date.now() puede saltar de golpe.
        let ticks = 0;
        const tick = () => {
            if (predicate()) return resolve();
            if (++ticks > maxTicks) {
                return reject(new Error("tiempo agotado esperando una condición"));
            }
            setTimeout(tick, 10);
        };
        tick();
    });
}

function dialogOpen() {
    return !document.getElementById("dialogRoot").classList.contains("hidden");
}

function click(selector) {
    const el = document.querySelector(selector);
    if (!el) throw new Error(`No se encontro ${selector}`);
    el.click();
    return el;
}

function setValue(selector, value) {
    const el = document.querySelector(selector);
    if (!el) throw new Error(`No se encontro ${selector}`);
    el.value = value;
    el.dispatchEvent(new Event("input", { bubbles: true }));
    el.dispatchEvent(new Event("change", { bubbles: true }));
    return el;
}

function cardCount() {
    return document.querySelectorAll(".productCard").length;
}

// --- Interacción con el sistema de diálogos de la app ---

// Responde un diálogo que pide texto y confirma.
//
// OJO: al confirmar uno puede abrirse otro de inmediato (por ejemplo, el
// de la contraseña después del nombre). Por eso acá NO se espera a que
// el diálogo se cierre: se espera a que la cadena asiente.
async function answerDialog(value) {
    await waitFor(dialogOpen);
    const input = document.querySelector("#dialogInput");
    if (!input) throw new Error("El dialogo abierto no pide texto");

    input.value = value;
    input.dispatchEvent(new Event("input", { bubbles: true }));

    const buttons = document.querySelectorAll("#dialogActions button");
    buttons[buttons.length - 1].click();

    await new Promise(r => setTimeout(r, 100));
}

// Confirma el diálogo abierto (último botón: Aceptar / Entendido).
async function acceptDialog() {
    await waitFor(dialogOpen);
    const buttons = document.querySelectorAll("#dialogActions button");
    buttons[buttons.length - 1].click();
    await waitFor(() => !dialogOpen());
}

// Cancela el diálogo abierto (primer botón: Cancelar).
async function cancelDialog() {
    await waitFor(dialogOpen);
    const buttons = document.querySelectorAll("#dialogActions button");
    buttons[0].click();
    await waitFor(() => !dialogOpen());
}

function dialogText() {
    return document.getElementById("dialogBody").textContent.trim();
}

// El formulario se queda en el DOM aunque el modal este cerrado,
// asi que hay que esperar a que este realmente abierto.
function waitForForm() {
    return waitFor(() =>
        !document.getElementById("actionPan").classList.contains("hidden") &&
        document.querySelector(".productFormModal") !== null
    );
}

// Rellena el formulario de nuevo perfil y lo confirma.
async function fillProfileForm({ nombre, negocio, password, color = 1 }) {
    await waitFor(dialogOpen);

    if (nombre !== undefined) document.getElementById("profileNameInput").value = nombre;
    if (negocio !== undefined) document.getElementById("profileBusinessInput").value = negocio;
    if (password !== undefined) document.getElementById("profilePasswordInput").value = password;

    const swatches = document.querySelectorAll(".colorSwatch");
    if (swatches[color]) swatches[color].click();

    const buttons = document.querySelectorAll("#dialogActions button");
    buttons[buttons.length - 1].click();

    await new Promise(r => setTimeout(r, 200));
}

// Abre el menu ⋮ de una tarjeta.
async function openCardMenu(index = 0) {
    const cards = document.querySelectorAll(".productCard");
    if (!cards[index]) throw new Error("No hay tarjeta " + index);

    cards[index].querySelector(".cardMenuBtn").click();
    await new Promise(r => setTimeout(r, 80));
}

// Pulsa una opcion del menu ⋮ de la tarjeta. Ojo: hay que buscar
// el item DENTRO de esa tarjeta, no en todo el documento (cada tarjeta
// tiene su propio menu).
async function clickCardAction(action, index = 0) {
    await openCardMenu(index);

    const card = document.querySelectorAll(".productCard")[index];
    const item = card.querySelector(`.cardMenuItem[data-card-action="${action}"]`);
    if (!item) throw new Error("No existe la accion " + action);

    item.click();
    await new Promise(r => setTimeout(r, 120));
}

// Abre el editor de un producto desde su menu ⋮.
async function openEditor(index = 0) {
    await clickCardAction("edit", index);
    await waitForForm();
}

// Marca la casilla de una tarjeta.
async function selectCard(index = 0) {
    const cards = document.querySelectorAll(".productCard");
    const check = cards[index].querySelector(".cardSelect");
    check.click();
    await new Promise(r => setTimeout(r, 100));
}

try {
    // Esta prueba BORRA los datos de la app en el localStorage del
    // sitio. Solo se ejecuta cuando se pide expresamente con ?ejecutar,
    // para que abrirla por accidente en el sitio publicado no borre
    // el inventario de nadie.
    if (!new URLSearchParams(location.search).has("ejecutar")) {
        throw new Error("__SIN_EJECUTAR__");
    }

    // =========================================================
    // Montar la app real
    // =========================================================
    localStorage.clear();
    window.__XSS = false;

    const html = await (await fetch("../index.html")).text();
    const parsed = new DOMParser().parseFromString(html, "text/html");

    // Se quita el <script> del HTML original: aca lo importamos a mano
    // para poder ejecutarlo DESPUES de montar el DOM.
    parsed.querySelectorAll("script").forEach(s => s.remove());
    document.body.innerHTML = parsed.body.innerHTML;

    await import("../home.js");

    ok("El modulo home.js carga sin errores", true);
    ok("Los perfiles por defecto se pintan",
        document.querySelectorAll(".profileCard").length === 2,
        `${document.querySelectorAll(".profileCard").length} tarjetas`);
    ok("La landing tapa la app al principio",
        document.getElementById("welcomeSection").classList.contains("hidden") === false &&
        document.getElementById("appRoot").classList.contains("hidden") === true);

    // =========================================================
    // El sistema de diálogos
    // =========================================================
    click("#welcomeGetStartedBt");
    ok("El boton Empezar entra a la app",
        document.getElementById("appRoot").classList.contains("hidden") === false &&
        document.getElementById("welcomeSection").classList.contains("hidden") === true);

    // El dialogo no existe hasta que se pide algo.
    ok("El dialogo arranca cerrado", !dialogOpen());

    // Validacion: no deja confirmar un nombre vacio.
    click("#createProfileBt");
    click('[data-store-type="general"]');
    click("#inventaryConfirmBt");
    await waitFor(dialogOpen);
    ok("Pedir un dato abre el dialogo de la app", dialogOpen());
    ok("El dialogo pide un nombre de perfil",
        document.getElementById("profileNameInput") !== null);
    ok("El formulario de perfil deja elegir color",
        document.querySelectorAll(".colorSwatch").length >= 6,
        `${document.querySelectorAll(".colorSwatch").length} colores`);

    // Escribir vacio y aceptar: la validacion debe impedirlo.
    document.getElementById("profileNameInput").value = "   ";
    const buttons = document.querySelectorAll("#dialogActions button");
    buttons[buttons.length - 1].click();
    await new Promise(r => setTimeout(r, 150));
    ok("La validacion impide confirmar un nombre vacio",
        dialogOpen() && document.getElementById("profileFormError").textContent.length > 0,
        document.getElementById("profileFormError").textContent);

    // Ahora si, con un nombre valido.
    await fillProfileForm({
        nombre: "Mi Tienda",
        negocio: "Bodega Don Pepe",
        password: "1234"
    });

    ok("El perfil se crea y se entra a la app",
        document.getElementById("appRoot").classList.contains("hidden") === false);
    ok("El boton de perfil muestra el nombre",
        document.getElementById("profileButtonName").textContent.trim() === "Mi Tienda",
        document.getElementById("profileButtonName").textContent);

    const perfilCreado = JSON.parse(localStorage.getItem("menuStockUsers"))
        .find(u => u.profile.name === "Mi Tienda");
    ok("El perfil guarda el nombre del negocio",
        perfilCreado.profile.business === "Bodega Don Pepe",
        perfilCreado.profile.business);
    ok("El perfil guarda un color",
        typeof perfilCreado.profile.color === "string" && perfilCreado.profile.color.length > 0,
        perfilCreado.profile.color);
    ok("El perfil guarda la contrasena",
        perfilCreado.password === "1234");

    // =========================================================
    // Prueba de XSS: nombre con HTML malicioso
    // =========================================================
    const XSS_NAME = 'Gaseosa <img src=x onerror="window.__XSS=true">';

    click("#addProduct");
    setValue("#newName", XSS_NAME);
    setValue("#nprice", "2500");
    setValue("#nstock", "10");
    click("#inventaryConfirmBt");

    ok("El nombre malicioso NO se ejecuta (XSS)", window.__XSS === false);
    ok("El nombre malicioso se escapa en el DOM",
        document.querySelector(".productCard h3").textContent === XSS_NAME,
        document.querySelector(".productCard h3").textContent);
    ok("No se inyecta un <img> dentro del nombre",
        document.querySelector(".productCard h3").querySelector("img") === null);
    ok("El producto se guardo en la lista",
        cardCount() === 1, `${cardCount()} tarjetas`);

    // =========================================================
    // Categorias
    // =========================================================
    click("#newCategoryBt");
    await answerDialog("Bebidas");
    click("#newCategoryBt");
    await answerDialog("Snacks");

    // A "Bebidas" se le agrega una subcategoria, para poder probar
    // tambien el cambio de subcategoria.
    click("#categoriesBt");
    const botonSubcat = [...document.querySelectorAll("[data-add-sub]")]
        .find(b => b.closest(".categoryCard").querySelector(".categoryName").textContent.trim() === "Bebidas");
    botonSubcat.click();
    await answerDialog("Gaseosas");

    click("#categoriesBt");
    const catCards = [...document.querySelectorAll(".categoryCard")];
    const nombresCat = catCards.map(c => c.querySelector(".categoryName").textContent.trim());
    ok("La vista de categorias lista Bebidas, Snacks y Sin categoria",
        nombresCat.includes("Bebidas") && nombresCat.includes("Snacks") && nombresCat.includes("Sin categoría"),
        nombresCat.join(" | "));

    // =========================================================
    // BUG: al confirmar, la vista de categoria se perdia
    // =========================================================
    const catButtons = [...document.querySelectorAll("[data-open-cat]")];
    const bebidasBtn = catButtons.find(b => b.textContent.trim() === "Bebidas");
    bebidasBtn.click();

    ok("Al entrar a Bebidas la lista queda vacia",
        cardCount() === 0, `${cardCount()} tarjetas`);

    click("#addProduct");
    setValue("#newName", "Pepsi");
    setValue("#nprice", "1800");
    setValue("#nstock", "5");

    const presetCat = document.getElementById("ncategory").value;
    ok("El producto nace dentro de la categoria actual",
        presetCat !== "", `categoria = ${presetCat ? "Bebidas" : "(ninguna)"}`);

    click("#inventaryConfirmBt");

    ok("Tras confirmar se sigue dentro de la categoria (el filtro no se pierde)",
        cardCount() === 1, `${cardCount()} tarjetas - si fuera 2+, el filtro se perdio`);
    ok("El producto se guardo con el nombre correcto",
        document.querySelector(".productCard h3").textContent === "Pepsi",
        document.querySelector(".productCard h3").textContent);

    // =========================================================
    // Ordenamiento numerico (bug del .sort() sin comparador)
    // =========================================================
    click("#productsBt");
    for (const [name, price] of [["Barato", "9"], ["Caro", "1000"], ["Medio", "100"]]) {
        click("#addProduct");
        setValue("#newName", name);
        setValue("#nprice", price);
        setValue("#nstock", "1");
        click("#inventaryConfirmBt");
    }

    const selector = document.getElementById("searchBy");
    selector.value = "maxPrice";
    selector.dispatchEvent(new Event("change", { bubbles: true }));
    setValue("#invSearch", "1000");

    const precios = [...document.querySelectorAll(".productCard .productInfo p:first-of-type")]
        .map(p => Number(p.textContent.replace("$", "")));
    const ordenCorrecto = precios.every((p, i) => i === 0 || precios[i - 1] <= p);

    ok("El filtro por precio ordena numericamente", ordenCorrecto, `precios: ${precios.join(", ")}`);

    // =========================================================
    // Venta y historial
    // =========================================================
    click("#productsBt");
    click(".productCard");
    ok("La cuenta se abre al hacer clic en un producto",
        document.getElementById("accumulatePanel").classList.contains("show"));
    ok("El total de la cuenta se muestra",
        document.getElementById("billTotal").textContent.startsWith("$"),
        document.getElementById("billTotal").textContent);

    click("#accumulateConfirmBt");
    await acceptDialog();     // aviso de "Venta finalizada"

    const usuarios = JSON.parse(localStorage.getItem("menuStockUsers"));
    const miPerfil = usuarios.find(u => u.profile.name === "Mi Tienda");
    const venta = miPerfil && miPerfil.historial[0];

    ok("La venta queda registrada en el historial del perfil",
        !!miPerfil && Array.isArray(miPerfil.historial) && miPerfil.historial.length === 1);
    ok("El historial guarda renglones estructurados (no \"[object Object]\")",
        !!venta &&
        Array.isArray(venta.venta) &&
        venta.venta.length === 1 &&
        typeof venta.venta[0].nombre === "string" &&
        typeof venta.venta[0].cantidad === "number",
        venta ? JSON.stringify(venta.venta) : "sin venta");
    ok("El historial guarda el total de la venta",
        !!venta && typeof venta.total === "number" && venta.total > 0,
        venta ? `total = ${venta.total}` : "sin venta");
    ok("El stock se desconto tras la venta",
        !!miPerfil && miPerfil.products.some(p => p.name.startsWith("Gaseosa") && p.quantity === 9),
        miPerfil ? miPerfil.products.map(p => `${p.name}:${p.quantity}`).join(", ") : "");

    const movs = miPerfil ? miPerfil.stockHistory : [];
    ok("El historial de stock registra los movimientos",
        Array.isArray(movs) && movs.length > 0, `${movs.length} movimientos`);
    ok("Los movimientos tienen accion y delta",
        movs.every(m => m.action && typeof m.change === "number"),
        movs.map(m => `${m.action}:${m.change}`).join(", "));

    // =========================================================
    // BARRA DE ACCIONES DELGADA + MENÚ POR TARJETA
    // =========================================================
    click("#productsBt");
    await new Promise(r => setTimeout(r, 80));

    ok("La barra de acciones esta en la vista de productos",
        !document.getElementById("actionsBar").classList.contains("hidden"));
    ok("La barra inferior solo tiene la accion principal",
        document.querySelectorAll("#actionsBar button").length === 1 &&
        document.getElementById("addProduct") !== null);
    ok("Las acciones viejas se quitaron de la barra",
        document.getElementById("editProduct") === null &&
        document.getElementById("changePrice") === null &&
        document.getElementById("delProduct") === null);
    ok("La barra flotante de seleccion arranca oculta",
        document.getElementById("selectionBar").classList.contains("hidden"));

    // --- Menú ⋮ de cada tarjeta ---
    ok("Cada tarjeta tiene su boton de menu",
        document.querySelectorAll(".productCard .cardMenuBtn").length ===
        document.querySelectorAll(".productCard").length);
    ok("Cada tarjeta tiene su casilla de seleccion",
        document.querySelectorAll(".productCard .cardSelect").length ===
        document.querySelectorAll(".productCard").length);

    await openCardMenu(0);
    const menuAbierto = document.querySelectorAll(".productCard")[0].querySelector(".cardMenu");
    ok("El menu ⋮ se abre con las cuatro acciones",
        !menuAbierto.hidden &&
        menuAbierto.querySelectorAll(".cardMenuItem").length === 4,
        [...menuAbierto.querySelectorAll(".cardMenuItem")].map(b => b.textContent.trim()).join(" | "));

    // Clic fuera cierra el menu
    document.getElementById("productsTitle").click();
    await new Promise(r => setTimeout(r, 80));
    ok("El menu se cierra al hacer clic fuera",
        document.querySelector(".productCard .cardMenu").hidden);

    // --- Casilla y barra flotante ---
    await selectCard(0);
    ok("Al marcar un producto aparece la barra flotante",
        !document.getElementById("selectionBar").classList.contains("hidden"));
    ok("La barra flotante cuenta los productos marcados",
        document.getElementById("selectionCount").textContent.includes("1 producto"),
        document.getElementById("selectionCount").textContent);
    ok("La tarjeta marcada se resalta",
        document.querySelectorAll(".productCard.selected").length === 1);

    await selectCard(1);
    ok("La barra flotante cuenta dos productos",
        document.getElementById("selectionCount").textContent.includes("2 productos"),
        document.getElementById("selectionCount").textContent);

    click("#selCancelBt");
    await new Promise(r => setTimeout(r, 100));
    ok("Cancelar quita las marcas y esconde la barra",
        document.getElementById("selectionBar").classList.contains("hidden") &&
        document.querySelectorAll(".productCard.selected").length === 0);

    // --- Acciones del menú ⋮ ---
    // Se crean productos propios: las pruebas de abajo usan otros
    // productos y no deben verse afectados.
    for (const [nombre, precio, stock] of [["Temporal Uno", "1000", "3"], ["Temporal Dos", "2000", "4"]]) {
        click("#addProduct");
        await waitFor(() => document.getElementById("newName") !== null);
        setValue("#newName", nombre);
        setValue("#nprice", precio);
        setValue("#nstock", stock);
        click("#inventaryConfirmBt");
        await acceptDialog();
    }

    const indiceDe = (nombre) => [...document.querySelectorAll(".productCard")]
        .findIndex(c => c.querySelector("h3").textContent === nombre);

    const idxUno = indiceDe("Temporal Uno");
    const idxDos = indiceDe("Temporal Dos");

    // Cambiar precio desde el menú ⋮
    await clickCardAction("price", idxUno);
    await waitFor(() =>
        dialogOpen() && document.getElementById("dialogTitle").textContent.includes("precio")
    );
    ok("El menu ⋮ abre el dialogo de cambiar precio",
        document.getElementById("dialogTitle").textContent.includes("precio"),
        document.getElementById("dialogTitle").textContent);

    document.getElementById("dialogInput").value = "1234";
    document.querySelectorAll("#dialogActions button")[1].click();

    await waitFor(() =>
        dialogOpen() && document.getElementById("dialogTitle").textContent.includes("Precio actualizado")
    );
    await acceptDialog();

    const precioTemporal = Number(
        [...document.querySelectorAll(".productCard")]
            .find(c => c.querySelector("h3").textContent === "Temporal Uno")
            .querySelector(".productInfo p").textContent.replace("$", "")
    );
    ok("Cambiar precio desde el menu actualiza el producto",
        precioTemporal === 1234, `precio = ${precioTemporal}`);

    // Eliminar desde el menú ⋮
    await clickCardAction("delete", idxDos);
    await waitFor(() =>
        dialogOpen() && document.getElementById("dialogTitle").textContent.includes("Eliminar")
    );
    ok("El menu ⋮ pide confirmacion antes de eliminar",
        document.getElementById("dialogTitle").textContent.includes("Eliminar"),
        document.getElementById("dialogTitle").textContent);

    await acceptDialog();
    await waitFor(() =>
        dialogOpen() && document.getElementById("dialogTitle").textContent.includes("Eliminado")
    );
    await acceptDialog();

    ok("Eliminar desde el menu borra el producto",
        indiceDe("Temporal Dos") === -1,
        `quedan ${document.querySelectorAll(".productCard").length} tarjetas`);

    // --- Acciones en bloque con la barra flotante ---
    await selectCard(indiceDe("Temporal Uno"));
    await selectCard(indiceDe("Gaseosa") >= 0 ? indiceDe("Gaseosa") : 0);
    ok("La barra flotante muestra las dos acciones",
        document.getElementById("selPriceBt") !== null &&
        document.getElementById("selDeleteBt") !== null);

    click("#selPriceBt");
    await waitFor(() =>
        dialogOpen() && document.getElementById("dialogTitle").textContent.includes("precio")
    );
    document.getElementById("dialogInput").value = "500";
    document.querySelectorAll("#dialogActions button")[1].click();

    await waitFor(() =>
        dialogOpen() && document.getElementById("dialogTitle").textContent.includes("Precio actualizado")
    );
    await acceptDialog();

    const precios500 = [...document.querySelectorAll(".productCard .productInfo p")]
        .map(p => Number(p.textContent.replace("$", "")))
        .filter(p => p === 500).length;
    ok("Cambiar precio en bloque aplica a todos los marcados",
        precios500 === 2, `${precios500} productos con precio 500`);

    // Se limpia: el producto temporal se elimina y el precio vuelve
    await clickCardAction("delete", indiceDe("Temporal Uno"));
    await waitFor(() =>
        dialogOpen() && document.getElementById("dialogTitle").textContent.includes("Eliminar")
    );
    await acceptDialog();
    await waitFor(() =>
        dialogOpen() && document.getElementById("dialogTitle").textContent.includes("Eliminado")
    );
    await acceptDialog();

    ok("Los productos de prueba se eliminaron",
        indiceDe("Temporal Uno") === -1 && indiceDe("Temporal Dos") === -1);

    // =========================================================
    // EDITAR PRODUCTO (cambiar categoría y subcategoría)
    // =========================================================
    // Se abre el formulario desde el menú ⋮ de la tarjeta
    await openEditor(0);

    ok("El formulario de edicion se abre desde el menu de la tarjeta",
        document.getElementById("modalTitle").textContent.includes("Editar"),
        document.getElementById("modalTitle").textContent);

    const precioGaseosa = Number(
        [...document.querySelectorAll(".productCard")]
            .find(c => c.querySelector("h3").textContent.startsWith("Gaseosa"))
            .querySelector(".productInfo p").textContent.replace("$", "")
    );

    // Al hacer clic en un producto se abre el formulario con sus datos
    click(".productCard");
    await waitForForm();

    ok("El formulario de edicion se abre con el nombre del producto",
        document.getElementById("newName").value.startsWith("Gaseosa"),
        document.getElementById("newName").value);
    ok("El formulario de edicion se abre con el precio del producto",
        document.getElementById("nprice").value === String(precioGaseosa),
        `${document.getElementById("nprice").value} (esperado ${precioGaseosa})`);
    ok("El formulario de edicion se abre con el stock del producto",
        document.getElementById("nstock").value === "9",
        document.getElementById("nstock").value);
    ok("El titulo del formulario dice que se esta editando",
        document.getElementById("modalTitle").textContent.includes("Editar"),
        document.getElementById("modalTitle").textContent);
    ok("El boton dice Guardar cambios",
        document.getElementById("inventaryConfirmBt").textContent.includes("Guardar"),
        document.getElementById("inventaryConfirmBt").textContent);

    // Se cambia la categoría a "Bebidas"
    const opcionBebidas = [...document.querySelectorAll("#ncategory option")]
        .find(o => o.textContent.trim() === "Bebidas");
    document.getElementById("ncategory").value = opcionBebidas.value;
    document.getElementById("ncategory").dispatchEvent(new Event("change", { bubbles: true }));
    await new Promise(r => setTimeout(r, 60));

    ok("Al elegir categoria se habilita el selector de subcategoria",
        document.getElementById("nsubcategory").disabled === false);
    ok("El selector de subcategoria ofrece las de esa categoria",
        [...document.querySelectorAll("#nsubcategory option")]
            .some(o => o.textContent.trim() === "Gaseosas"),
        [...document.querySelectorAll("#nsubcategory option")].map(o => o.textContent.trim()).join(", "));

    // Y se elige la subcategoria

    await waitFor(() => document.getElementById("variantModeGrid") !== null);

    ok("El formulario de alta usa la pantalla completa",
        document.querySelector(".productFormModal") !== null &&
        document.querySelector(".modal.show") === null);
    ok("Los campos del formulario van en una rejilla",
        document.querySelectorAll(".productFormGrid input").length === 6 &&
        document.querySelectorAll(".productFormGrid select").length === 4,
        `${document.querySelectorAll(".productFormGrid input").length} inputs, ${document.querySelectorAll(".productFormGrid select").length} selects`);
    ok("El titulo del formulario encabeza la pantalla",
        document.getElementById("modalTitle").textContent.includes("Agrega un nuevo producto"),
        document.getElementById("modalTitle").textContent);

    // Tienda de ropa: modos de variante
    ok("La tienda de ropa muestra los 4 modos de variante",
        document.querySelectorAll("#variantModeGrid .storeTypeOption").length === 4);

    const modos = [...document.querySelectorAll("#variantModeGrid .storeTypeOption")];
    ok("El modo por defecto es Articulo unico y es el unico marcado",
        modos[0].classList.contains("selected") &&
        modos.slice(1).every(b => !b.classList.contains("selected")));

    modos[3].click();
    await new Promise(r => setTimeout(r, 120));

    const trasClick = [...document.querySelectorAll("#variantModeGrid .storeTypeOption")];
    ok("Al elegir un modo solo queda ese marcado",
        trasClick[3].classList.contains("selected") &&
        trasClick.slice(0, 3).every(b => !b.classList.contains("selected")),
        trasClick.map(b => b.dataset.variantMode + (b.classList.contains("selected") ? "*" : "")).join(","));

    ok("El campo de stock se deshabilita cuando el stock sale de las tallas",
        document.getElementById("nstock").disabled === true);
    ok("Aparecen las casillas de las tallas configuradas",
        document.querySelectorAll(".sizeCheck").length === 4,
        `${document.querySelectorAll(".sizeCheck").length} casillas`);

} catch (error) {
    if (error.message !== "__SIN_EJECUTAR__") {
        fail("excepcion no controlada", error);
    }
}

// El bloque de resultados se vuelve a pegar: body.innerHTML lo habia borrado.
document.body.appendChild(out);
out.textContent = log.join("\n");
</script>
</body>
</html>
