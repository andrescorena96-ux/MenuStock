<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Render del logo de cabecera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 1000px;
            height: 260px;
            overflow: hidden;
            /* Transparente: el logo se usa sobre la cabecera oscura. */
            background: transparent;
        }
        .marco { width: 1000px; height: 260px; }
        .marco svg { display: block; width: 1000px; height: 260px; }
    </style>
</head>
<body>
    <div class="marco" id="marco"></div>
    <script type="module">
        if (document.fonts && document.fonts.ready) {
            await document.fonts.load("600 124px Fraunces");
            await document.fonts.ready;
        }

        const svg = await (await fetch("./assets/logo.svg")).text();
        document.getElementById("marco").innerHTML = svg;
        document.body.dataset.listo = "si";
    </script>
</body>
</html>
